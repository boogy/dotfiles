[env]
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }
MISE_PYTHON_DEFAULT_PACKAGES_FILE = "~/.config/mise/default-python-packages"

[tools]
claude = { version = "latest", auto_update = true }
node = { version = "lts", minimum_release_age = "1d", auto_update = "12h" }
aws-cli = { version = "latest", auto_update = "12h", symlink_bins = "true" }
opentofu = "1.13.2"
python = "3.15.2"
terraform = "1.17.0"
terraform-docs = "0.24.0"
terraform-ls = "latest"
terragrunt = "1.2.1"
tflint = "latest"
uv = "latest"

[settings]
lockfile = true
# tool_update.global_auto = "24h" # update each tool every 12 hours
# minimum_release_age = "7d" # raise the default 24h delay to 7 days
jobs = 8
env_shell_expand = true
experimental = true
status.show_env = true
disable_backends = [
  "asdf",
  "cargo",
  "conda",
  "dotnet",
  "forgejo",
  "gem",
  # "github",
  # "go",
  # "pypi",
  # "http",
  # "s3",
  "gitlab",
  "packslip",
  "spinel",
  "spm",
  "ubi",
  "vfox",
]
# locked = true
# always_keep_download = true

[settings.python]
compile = false

[settings.task]
run_auto_install = true

[bootstrap.mise_shell_activate]
zsh = true

# [tasks.bootstrap]
# run = "node --version"

[bootstrap.packages]
"brew-cask:firefox" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:zed" = "latest"
"brew-cask:karabiner-elements" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:docker-desktop" = "latest"
"brew-cask:neovide" = "latest"
"brew-cask:obsidian" = "latest"
# "brew-cask:font-jetbrains-mono" = { os = ["linux", "macos"] }
"brew:zsh-autosuggestions" = "latest"
"brew:zsh-completions" = "latest"
"brew:zsh-fast-syntax-highlighting" = "latest"
"brew:zsh-syntax-highlighting" = "latest"
"brew:tmux" = "latest"
"brew:neovim" = "latest"
"brew:eza" = "latest"
"brew:jq" = "latest"
"brew:yq" = "latest"
"brew:go" = "latest"
"brew:ruff" = "latest"
"brew:starship" = "latest"
"brew:prettier" = "latest"
"brew:ripgrep" = "latest"
"brew:fzf" = "latest"

[tasks.upgrade-interactive]
description = "Upgrade all tools and packages interactively."
run = "mise upgrade --interactive --bump"

[tasks.outdated-global]
description = "Check for outdated global packages."
run = "mise outdated --global"

[tasks.install-system-tools]
description = "Install Python System Tools with UV"
run = ["uv tool install iam-policy-validator"]

[tasks.install-python-package]
description = "Install a Python package using UV."
run = "uv pip install --system ruff httpx requests pydantic"
